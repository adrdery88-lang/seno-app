name: Build Android APK (Seno)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release APK (SDK 36 / Android 7+)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36 & Build Tools
        shell: bash
        run: |
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Flutter 3.29.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: stable
          cache: true

      - name: Configure Android SDK and Flutter paths
        shell: bash
        run: |
          chmod +x android/gradlew
          FLUTTER_SDK="$(dirname "$(dirname "$(readlink -f "$(command -v flutter)")")")"
          test -x "$FLUTTER_SDK/bin/flutter"
          {
            echo "flutter.sdk=$FLUTTER_SDK"
            echo "flutter.versionCode=1"
            echo "flutter.versionName=1.0"
          } > android/local.properties
          cat android/local.properties

      - name: Verify Android manifest permissions
        run: python3 scripts/setup_android.py

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart sources
        continue-on-error: true
        shell: bash
        run: |
          flutter analyze --no-pub 2>&1 | tee /tmp/seno-analyze.log
          grep -iE "error •|Error:|isn't a type|No named parameter" /tmp/seno-analyze.log | head -n 60 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Build universal release APK
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "Build attempt ${attempt} of 3"
            flutter build apk --release 2>&1 | tee /tmp/seno-build.log
            status=${PIPESTATUS[0]}
            if [ "$status" -eq 0 ]; then
              echo "APK built successfully on attempt ${attempt}"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Build failed; retrying in 15s (transient Maven/network errors)"
              sleep 15
            fi
          done
          echo "APK build failed after 3 attempts"
          exit 1

      - name: Report build failure details
        if: failure()
        shell: bash
        run: |
          if [ -f /tmp/seno-build.log ]; then
            grep -iE -A 4 "FAILURE:|What went wrong|Execution failed|error:|^e: |Caused by|Could not|Must provide|Unsupported|Invalid|Exception|A problem occurred|AndroidManifest.xml Error" /tmp/seno-build.log | head -n 80 | while IFS= read -r line; do
              echo "::error::${line}"
            done || true
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: seno-android-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14
          if-no-files-found: error
