name: Build Android APK (Seno)



on:

  push:
  
    branches: [ main, master ]
    
  pull_request:
  
    branches: [ main, master ]
    
  workflow_dispatch:
  


jobs:

  build:
  
    name: Build Android Release APK (Android SDK 36 / Android 7+)
    
    runs-on: ubuntu-24.04
    
    timeout-minutes: 30
    
    steps:
    
      - name: Checkout Code
      
        uses: actions/checkout@v4
        


      - name: Set up Java JDK 17
      
        uses: actions/setup-java@v5
        
        with:
        
          distribution: temurin
          
          java-version: '17'
          


      - name: Install Android SDK 36 & Build Tools
      
        run: |
        
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          
          if [ ! -x "$SDKMANAGER" ]; then
          
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
            
          fi
          
          test -x "$SDKMANAGER"
          
          yes | "$SDKMANAGER" --licenses || true
          
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
          


      - name: Set up Flutter (3.29.0)
      
        uses: subosito/flutter-action@v2
        
        with:
        
          flutter-version: '3.29.0'
          
          channel: stable
          
          cache: true
          


      - name: Regenerate Android project from Flutter template
      
        run: |
        
          # Regenerate only Android; lib/ and pubspec.yaml remain untouched.
          
          rm -rf android
          
          flutter create --platforms=android --org com.seno .
          
          python3 - <<'PY'
          
          import re
          
          from pathlib import Path
          
          candidates = sorted(Path('android/app').glob('build.gradle*'))
          
          if not candidates:
          
              raise SystemExit('No Android app Gradle build file was generated')
              
          p = candidates[0]
          
          s = p.read_text()
          
          s = re.sub(r'namespace\s*=\s*["\'][^"\']+["\']', 'namespace = "com.seno.app"', s)
          
          s = re.sub(r'applicationId\s*=\s*["\'][^"\']+["\']', 'applicationId = "com.seno.app"', s)
          
          s = re.sub(r'applicationId\s+["\'][^"\']+["\']', 'applicationId "com.seno.app"', s)
          
          s = re.sub(r'compileSdk\s*=\s*[^\n]+', 'compileSdk = 36', s)
          
          s = re.sub(r'minSdk\s*=\s*[^\n]+', 'minSdk = 21', s)
          
          s = re.sub(r'targetSdk\s*=\s*[^\n]+', 'targetSdk = 36', s)
          
          if 'multiDexEnabled true' not in s:
          
              s = s.replace('targetSdk = 36', 'targetSdk = 36\n        multiDexEnabled true')
              
          p.write_text(s)
          
          print(f'Configured {p}')
          
          print(s)
          
          PY
          


      - name: Configure Flutter SDK path
      
        run: |
        
          FLUTTER_SDK="$(dirname "$(dirname "$(readlink -f "$(command -v flutter)")")")"
          
          test -x "$FLUTTER_SDK/bin/flutter"
          
          {
          
            echo "flutter.sdk=$FLUTTER_SDK"
            
            echo "flutter.versionCode=1"
            
            echo "flutter.versionName=1.0"
            
          } > android/local.properties
          
          echo "Using Flutter SDK: $FLUTTER_SDK"
          
          cat android/local.properties
          


      - name: Setup Android permissions
      
        run: python3 scripts/setup_android.py
        


      - name: Clean Build Cache
      
        run: flutter clean
        


      - name: Install Dependencies
      
        run: flutter pub get
        


      - name: Build Release APK
      
        shell: bash
        
        run: |
        
          for attempt in 1 2 3; do
          
            echo "Build attempt $attempt of 3















































































