name: Build Android APK (Seno)



on:

  push:
  
    branches: [ main, master ]
    
  pull_request:
  
    branches: [ main, master ]
    
  workflow_dispatch:
  


jobs:

  build:
  
    name: Build Android Release APK (Android SDK 36 / Android 7+)
    
    runs-on: ubuntu-24.04
    
    timeout-minutes: 30
    
    steps:
    
      - name: Checkout Code
      
        uses: actions/checkout@v4
        


      - name: Set up Java JDK 17
      
        uses: actions/setup-java@v5
        
        with:
        
          distribution: temurin
          
          java-version: '17'
          


      - name: Install Android SDK 36 & Build Tools
      
        run: |
        
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          
          if [ ! -x "$SDKMANAGER" ]; then
          
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
            
          fi
          
          test -x "$SDKMANAGER"
          
          yes | "$SDKMANAGER" --licenses || true
          
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
          


      - name: Set up Flutter (3.24.3)
      
        uses: subosito/flutter-action@v2
        
        with:
        
          flutter-version: '3.24.3'
          
          channel: stable
          
          cache: true
          


      - name: Configure Flutter SDK path
      
        run: |
        
          FLUTTER_SDK="$(dirname "$(dirname "$(readlink -f "$(command -v flutter)")")")"
          
          test -x "$FLUTTER_SDK/bin/flutter"
          
          {
          
            echo "flutter.sdk=$FLUTTER_SDK"
            
            echo "flutter.versionCode=1"
            
            echo "flutter.versionName=1.0"
            
          } > android/local.properties
          
          echo "Using Flutter SDK: $FLUTTER_SDK"
          
          cat android/local.properties
          


      - name: Setup Android Permissions and Gradle
      
        run: |
        
          chmod +x android/gradlew
          
          python3 scripts/setup_android.py
          


      - name: Clean Build Cache
      
        run: flutter clean
        


      - name: Install Dependencies
      
        run: flutter pub get
        


      - name: Build Release APK
      
        run: flutter build apk --release --verbose
        


      - name: Upload APK Artifact
      
        uses: actions/upload-artifact@v4
        
        with:
        
          name: seno-android-apk
          
          path: build/app/outputs/flutter-apk/*.apk
          
          retention-days: 14
          





























































